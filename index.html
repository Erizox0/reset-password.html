<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrniBik - Diagnostic Test</title>
    <style>
        body { background-color: #111111; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #1E1E1E; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #333; }
        h1 { color: #D50000; letter-spacing: 2px; margin-bottom: 30px; }
        button { width: 100%; padding: 14px; margin-top: 20px; border-radius: 8px; border: none; background-color: #D50000; color: white; font-weight: bold; cursor: pointer; }
        .message { margin-top: 20px; font-size: 14px; }
        .success { color: #00C851; font-weight: bold; border: 1px solid #00C851; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CRNIBIK</h1>
        <div id="js-test-msg" style="color: #888; margin-bottom: 20px;">Čekanje na JavaScript...</div>

        <button id="submit-btn">PROMIJENI LOZINKU</button>

        <div id="status-message" class="message"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const jsMsg = document.getElementById("js-test-msg");
            const button = document.getElementById("submit-btn");
            const status = document.getElementById("status-message");

            // Diagnostic Step 1: JS working
            if (jsMsg) {
                jsMsg.innerText = "TEST: JAVASCRIPT RADI";
                jsMsg.style.color = "#00C851";
            }

            if (!button) {
                document.body.innerHTML += '<div style="color:red; position: fixed; top: 0;">BUTTON NOT FOUND</div>';
                return;
            }

            // Diagnostic Step 2: Click listener
            button.addEventListener("click", () => {
                if (status) {
                    status.innerText = "TEST: BUTTON CLICK RADI";
                    status.className = "message success";
                } else {
                    alert("TEST: BUTTON CLICK RADI (ali status element nije pronađen)");
                }
            });
        });
    </script>
</body>
</html>
