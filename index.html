
<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CrniBik - Reset Lozinke</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 400px;

    background: #151515;

    border: 2px solid #d00000;
    border-radius: 16px;

    padding: 30px;

    box-shadow: 0 0 30px rgba(255, 0, 0, 0.35);
}

.logo {
    text-align: center;

    font-size: 36px;
    font-weight: bold;

    color: #ff0000;

    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #aaa;

    margin-bottom: 25px;
}

input {
    width: 100%;

    padding: 14px;

    margin-bottom: 15px;

    background: #0b0b0b;
    color: white;

    border: 1px solid #444;
    border-radius: 8px;

    font-size: 16px;
}

input:focus {
    outline: none;
    border-color: red;
}

button {
    width: 100%;

    padding: 14px;

    background: #d00000;
    color: white;

    border: none;
    border-radius: 8px;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #ff0000;
}

.message {
    text-align: center;

    margin-top: 18px;

    color: #ccc;

    min-height: 20px;
}

.footer {
    text-align: center;

    color: #666;

    font-size: 12px;

    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        CRNIBIK
    </div>

    <div class="subtitle">
        Promjena lozinke
    </div>

    <input
        type="password"
        id="password"
        placeholder="Nova lozinka"
    >

    <input
        type="password"
        id="confirmPassword"
        placeholder="Potvrdi novu lozinku"
    >

    <button onclick="changePassword()">
        PROMIJENI LOZINKU
    </button>

    <div class="message" id="message"></div>

    <div class="footer">
        CrniBik Password Recovery
    </div>

</div>

<script>

function changePassword() {

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");

    if (password.length < 6) {

        message.innerText =
            "Lozinka mora imati najmanje 6 karaktera.";

        return;
    }

    if (password !== confirmPassword) {

        message.innerText =
            "Lozinke se ne podudaraju.";

        return;
    }

    message.innerText =
        "Lozinka je spremna za promjenu.";

}

</script>

</body>
</html>
